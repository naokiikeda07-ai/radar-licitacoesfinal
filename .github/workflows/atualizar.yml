name: Atualizar Licitacoes
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
jobs:
  buscar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python coletor_total.py
      - run: |
          git config user.name "Robo Licitacoes"
          git config user.email "robo@empresa.com"
          git add licitacoes_hoje.json
          git commit -m "Atualiza editais" || exit 0
          git push
